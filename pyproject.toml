[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trade-strategies"
version = "0.1.0"
description = "Comprehensive dependency-free library of trading strategies (trend, mean-reversion, momentum, volatility, volume, multi-asset, meta) with a lazy trade-backtest bridge"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trade-suite" }]
keywords = ["trading", "strategies", "quant", "finance", "backtesting", "indicators"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/crieck2010/trade-strategies"
Repository = "https://github.com/crieck2010/trade-strategies"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
